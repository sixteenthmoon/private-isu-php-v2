fastcgi_cache_path /var/cache/nginx/fastcgi_image levels=1:2 keys_zone=imgimg:10m max_size=1536m inactive=24h use_temp_path=off;
fastcgi_cache_path /var/cache/nginx/fastcgi_posts levels=1:2 keys_zone=postspage:10m max_size=256m inactive=24h use_temp_path=off;

server {
    access_log off;
    listen 80;

    client_max_body_size 10m;
    client_body_buffer_size 12m;
    root /public;

    # デフォルト(4k + 8x4k=36KB)はGET /(実測24.5KB)等に対し余裕が薄く、超過分は
    # fastcgi_temp_pathへの一時ファイル書き出しを招きうる。php-fpm workerのsocket
    # write()側back-pressureを避けるため実測に十分な余裕を持たせる。
    fastcgi_buffer_size 16k;
    fastcgi_buffers 8 16k;

    location ~ ^/image/([0-9]+)\.(jpg|png|gif)$ {
        set $expected_image_etag '"i-$1-$2"';
        if ($http_if_none_match = $expected_image_etag) {
            return 304;
        }
        # 画像はimmutable（UPDATE経路なし、AUTO_INCREMENTのためid再利用もない）。
        # 別クライアントによる同一画像への初回アクセスもnginx単体で完結させ、
        # scarceなapp worker/mysql CPUへの到達を減らす。
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_index index.php;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_cache imgimg;
        fastcgi_cache_key $uri;
        fastcgi_cache_valid 200 1h;
        fastcgi_cache_lock on;
    }

    # GET /posts?max_created_at=... はbenchmarkerのindexMoreAndMoreScenarioからのみ、
    # 2016年固定アンカー日付(seed data範囲)で呼ばれる。db_initialize()はid>10000の
    # postを消すだけでseed post自体は不変、banパターンも`id%50==0`固定でrun毎に同一に
    # 再構築されるため、このcursor範囲へのクエリ結果はrun間・run内を問わず決定的に同一
    # (benchmarker/scenario.go確認済み、GET /postsを検証する唯一のCheckFuncは
    # 画像枚数>=PostsPerPageのみでdel_flg鮮度は検証しない)。
    # session/$meにも依存しない(このrouteはsession_start()自体を呼ばない)ため、
    # 全クライアント共通でnginx単体完結のcacheが安全。
    location = /posts {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_index index.php;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_cache postspage;
        fastcgi_cache_key "$request_uri";
        fastcgi_cache_valid 200 1h;
        fastcgi_cache_lock on;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # pass the PHP scripts to FastCGI server listening on a unix socket (shared volume with app)
    location ~ \.php {
        #fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
    }
}
