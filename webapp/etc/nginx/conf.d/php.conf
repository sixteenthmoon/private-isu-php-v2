fastcgi_cache_path /var/cache/nginx/fastcgi_image levels=1:2 keys_zone=imgimg:10m max_size=1536m inactive=24h use_temp_path=off;

server {
    access_log off;
    listen 80;

    client_max_body_size 10m;
    client_body_buffer_size 12m;
    root /public;

    # デフォルト(4k + 8x4k=36KB)はGET /(実測24.5KB)等に対し余裕が薄く、超過分は
    # fastcgi_temp_pathへの一時ファイル書き出しを招きうる。php-fpm workerのsocket
    # write()側back-pressureを避けるため実測に十分な余裕を持たせる。
    fastcgi_buffer_size 16k;
    fastcgi_buffers 8 16k;

    location ~ ^/image/([0-9]+)\.(jpg|png|gif)$ {
        set $expected_image_etag '"i-$1-$2"';
        if ($http_if_none_match = $expected_image_etag) {
            return 304;
        }
        # 画像はimmutable（UPDATE経路なし、AUTO_INCREMENTのためid再利用もない）。
        # 別クライアントによる同一画像への初回アクセスもnginx単体で完結させ、
        # scarceなapp worker/mysql CPUへの到達を減らす。
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_index index.php;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_cache imgimg;
        fastcgi_cache_key $uri;
        fastcgi_cache_valid 200 1h;
        fastcgi_cache_lock on;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # pass the PHP scripts to FastCGI server listening on a unix socket (shared volume with app)
    location ~ \.php {
        #fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
    }
}
