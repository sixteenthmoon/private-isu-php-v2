# private-isu-php-v1という別checkoutも同じ既定project名"private-isu"を使っており、
# どちらかでdocker compose upすると相手のcontainerを無言で置き換えてしまう事故が
# 実際に発生した(container名衝突、v1のmysqld/nginxがv2のcontainer名を乗っ取り、
# app/nginxはv1側の設定と噛み合わずcrash)。project名を明示して衝突を避ける。
name: private-isu-v2
services:
  nginx:
    image: nginx:1.30
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./etc/nginx/conf.d:/etc/nginx/conf.d
      - ./public:/public
      - php-fpm-run:/var/run/php-fpm
      # fastcgi_cache格納先。containerの一時レイヤ上だとdocker compose down等の
      # コンテナ再作成で消え、restart直後にキャッシュを埋め直すコスト(cold-start dip)を
      # 毎回払うことになるため永続volume化する。
      - nginx-fastcgi-cache:/var/cache/nginx/fastcgi_image
    ports:
      - "80:80"
    networks:
      - my_network

  app:
    build:
      # Go実装は golang/ PHP実装は php/ Python実装は python/ Node.js実装は node/ に変更
      context: php/
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mysql
      - memcached
    environment:
      ISUCONP_DB_HOST: mysql
      ISUCONP_DB_PORT: 3306
      ISUCONP_DB_SOCKET: /var/run/mysqld/mysqld.sock
      ISUCONP_DB_USER: root
      ISUCONP_DB_PASSWORD: root
      ISUCONP_DB_NAME: isuconp
      ISUCONP_MEMCACHED_ADDRESS: memcached:11211
      ISUCONP_MEMCACHED_SOCKET: /var/run/memcached/memcached.sock
    networks:
      - my_network
    volumes:
      - ./public:/home/public
      - mysql-run:/var/run/mysqld
      - memcached-run:/var/run/memcached
      - php-fpm-run:/var/run/php-fpm
    init: true
    # session.save_path=/dev/shm/php-sessionsはtmpfsだが、Dockerのデフォルト/dev/shm
    # サイズは64MBしかない。高スループット下でsession fileが蓄積し64MBを使い切ると、
    # 以降のsession書き込みが容量不足で失敗し中身が空のsession fileが生成される
    # (get_session_user()が直前にログイン成功したセッションをnullとして扱う原因、
    # nginx-posts-pagination系incident参照)。session file自体は小さい(~150-300 byte)ため、
    # 現実的などんな負荷でも枯渇しない程度に余裕を持たせる。
    shm_size: "256m"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  mysql:
    image: mysql:9.7
    restart: unless-stopped
    # ベンチ環境はinitializeで毎回既知状態へリセットされるため、mysqld crash時に
    # 最大1秒分のcommit済みトランザクションを失うリスクを許容しcommit毎fsyncを避ける。
    command: --innodb-flush-log-at-trx-commit=2 --innodb-buffer-pool-size=256M --innodb-buffer-pool-dump-pct=100
    environment:
      #- "TZ=Asia/Tokyo"
      - "MYSQL_ROOT_HOST=%"
      - "MYSQL_ROOT_PASSWORD=root"
    volumes:
      - mysql:/var/lib/mysql
      - mysql-run:/var/run/mysqld
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - my_network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  memcached:
    image: memcached:1.6
    restart: unless-stopped
    # appとunix socketで通信し、docker bridge経由のTCP接続overheadを避ける。
    # 名前付きvolumeがroot:root 755で作られ、イメージ既定のmemcacheユーザーでは
    # socketファイルを作成できないためrootで実行する。
    user: root
    command: -u root -s /var/run/memcached/memcached.sock -a 766
    volumes:
      - memcached-run:/var/run/memcached
    networks:
      - my_network

volumes:
  # project名変更(private-isu -> private-isu-v2)でvolume名が既定では
  # private-isu-v2_* に変わってしまい既存データ(seed+蓄積)から切り離されるため、
  # 既存の実volume名へ明示的に固定する。
  mysql:
    name: private-isu_mysql
  mysql-run:
    name: private-isu_mysql-run
  memcached-run:
    name: private-isu_memcached-run
  php-fpm-run:
    name: private-isu_php-fpm-run
  nginx-fastcgi-cache:
    name: private-isu_nginx-fastcgi-cache

networks:
  my_network:
